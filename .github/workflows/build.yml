name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        version: [15, 26]
        xcode-select: ["xcode", "clt"]
      fail-fast: false

    name: Build (macos-${{ matrix.version }}${{ matrix.xcode-select == 'clt' && ', Command Line Tools' || '' }})

    runs-on: macos-${{ matrix.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Switch to Xcode Command Line Tools
      if: ${{ matrix.xcode-select == 'clt' }}
      run: sudo xcode-select --switch /Library/Developer/CommandLineTools

    # Never `make install` here: CI must not touch the runner's PAM configuration.
    - name: Build and check
      run: make check

    - name: Verify exported PAM entry points
      run: |
        lipo -info pam_watchid.so
        nm -gU pam_watchid.so | grep -q '_pam_sm_authenticate$'
